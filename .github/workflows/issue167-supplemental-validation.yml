name: Issue 167 supplemental validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/issue167-d8e2f1c-supplemental'

permissions:
  contents: read

jobs:
  provenance-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prove exact-source parent and CI-only diff
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='72732a2b3e130224f8fc1dc58553451be0e7612a'
          expected_source='d8e2f1cc71bd0e130b995792ddd90027aab54a12'
          expected_migration_sha='5ce820c7c6fe9f72d742a748f81e27c279ff8ac7de16a512a78d0d7713883518'
          migration='supabase/migrations/20260911215509_issue167_study_sandbox_lifecycle_recovery.sql'

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          mapfile -t changed_paths < <(git diff --name-only HEAD^ HEAD)
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = '.github/workflows/issue167-supplemental-validation.yml'
          test "$(tr -d '\r\n' < CI_SOURCE_SHA.txt)" = "$expected_source"
          test "$(sha256sum "$migration" | awk '{print $1}')" = "$expected_migration_sha"

  issue167-database-supplemental:
    needs: provenance-guard
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - name: Confirm pinned Supabase CLI
        shell: bash
        run: test "$(npx --yes supabase@2.115.0 --version | head -n 1)" = '2.115.0'
      - name: Issue 167 disposable database validation
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/certsim-issue167-supplemental-db"
          cleanup() {
            npx --yes supabase@2.115.0 --workdir "$workdir" stop --no-backup || true
          }
          trap cleanup EXIT

          node scripts/supabase-migration-validation/prepare-migrations.mjs --set assignment --output "$workdir"
          npx --yes supabase@2.115.0 --workdir "$workdir" start --exclude studio,imgproxy,mailpit,storage-api,realtime,logflare,vector,supavisor,edge-runtime >/dev/null
          npx --yes supabase@2.115.0 --workdir "$workdir" db reset --local --no-seed
          npx --yes supabase@2.115.0 --workdir "$workdir" test db --local \
            "$GITHUB_WORKSPACE/supabase/tests/backend_exam_delivery_issue167.sql"

          set -a
          eval "$(npx --yes supabase@2.115.0 --workdir "$workdir" status -o env)"
          set +a
          migration_count="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from supabase_migrations.schema_migrations')"
          test "$migration_count" = '80'
          echo "Verified migration replay: $migration_count/80"

          SUPABASE_DB_URL="$DB_URL" \
            node scripts/test-issue167-study-sandbox-lifecycle-integration.mjs
          npm run validate:issue167

          npx --yes supabase@2.115.0 --workdir "$workdir" stop --no-backup
          trap - EXIT
          echo 'Disposable Supabase stack cleanup PASS'

  issue167-frontend-supplemental:
    needs: provenance-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - run: npx playwright install --with-deps chromium
      - name: Issue 167 static validation
        run: npm run validate:issue167
      - name: Focused protected lifecycle browser validation
        run: npx playwright test tests/r3g/protected-lifecycle.spec.js --reporter=line
      - name: Auth-configured browser validation
        run: npx playwright test --config playwright.auth.config.js --reporter=line
      - name: Full static validation
        run: npm run validate
      - name: Default build
        run: npm run build
      - name: Delivery build validation
        run: npm run validate:delivery-builds
      - name: Diff check
        run: git diff --check HEAD^..HEAD
