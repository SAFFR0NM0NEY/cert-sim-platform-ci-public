name: Issue201 disposable database foundation
on:
  push:
    branches: [supplemental/issue201-8f69ef0-cli2114]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-source provenance and one-file supplemental boundary
        env:
          BASE: 890089d373c0c88b3aedb048f44a1b5540d41765
          PRIVATE: 8f69ef0acd6732984d0cd5f8a4ec72920d1de975
          MANIFEST: 202b5da0bbfe6c933c619169e553bba9ce21a86cd51995fe196579e6dd2e9092
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SAFFR0NM0NEY/cert-sim-platform-ci-public
          test "$GITHUB_REF_NAME" = supplemental/issue201-8f69ef0-cli2114
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = .github/workflows/issue201-cli2114-validation.yml
          node <<'NODE'
          const {readFileSync}=require('node:fs'),{createHash}=require('node:crypto'),{execFileSync}=require('node:child_process');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const manifest=readFileSync('CI_EXPORT_MANIFEST.tsv');
          if(hash(manifest)!==process.env.MANIFEST)throw Error('manifest mismatch');
          if(readFileSync('CI_SOURCE_SHA.txt','utf8').trim()!==process.env.PRIVATE)throw Error('private sha mismatch');
          const entries=manifest.toString().trimEnd().split(/\r?\n/).slice(1),paths=[];
          for(const row of entries){const [p,size,digest]=row.split('\t');const b=readFileSync(p);if(b.length!==Number(size)||hash(b)!==digest)throw Error('entry mismatch '+p);paths.push(p);}
          const tree=execFileSync('git',['ls-tree','-r','--name-only',process.env.BASE],{encoding:'utf8'}).trim().split('\n').sort();
          if(JSON.stringify(tree)!==JSON.stringify([...paths,'CI_EXPORT_MANIFEST.tsv'].sort()))throw Error('unmanifested path');
          console.log('EXACT_SOURCE_PROVENANCE=PASS entries='+entries.length);
          NODE
  database:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - name: Full replay, 89/90 upgrades, real two-session races and regressions
        run: bash scripts/run-issue201-disposable.sh
      - name: Verify cleanup
        if: always()
        run: |
          npx --yes supabase@2.114.0 --workdir "$RUNNER_TEMP/certsim-issue201" stop --no-backup >/dev/null 2>&1 || true
          if docker ps -a --format '{{.Names}}' | grep -Eq '_certsim-backend-exam-delivery-validation$'; then exit 1; fi
          echo DISPOSABLE_CLEANUP=PASS
